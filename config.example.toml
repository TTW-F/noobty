# Noobty hub configuration
# Copy to config.toml (or point the NOOBTY_CONFIG env var at this file) and edit.

# HTTP port the hub listens on
port = 7317

# Directory containing the built web UI, served as static files
web_dir = "web/dist"

# Hub database (SQLite) and stored files live under this directory
storage_path = "data"

# Retention for stored files, in days
retention_days = 5

# Total storage cap for stored files, in bytes (default: 30 GiB).
# When the cap is reached, the oldest-uploaded files are cleaned first.
max_total_bytes = 32212254720

# Advisory chunk size for resumable uploads; also the request body limit.
chunk_size = 4194304

# Upload sessions untouched for longer than this are swept (row + staging
# blob), returning their reserved quota. In hours.
upload_ttl_hours = 24
