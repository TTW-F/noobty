<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Noobty — 连接中枢</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --ink: #17181c;
        --muted: #5d6672;
        --line: #e2e6ea;
        --primary: #10728a;
        --on-primary: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17181c;
          --ink: #e8eaee;
          --muted: #9aa3ad;
          --line: #2a2d33;
          --primary: #4fc3dc;
          --on-primary: #14181c;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC", sans-serif;
      }
      .card { width: min(420px, calc(100vw - 48px)); }
      .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
      .mark { width: 52px; height: 52px; border-radius: 12px; background: var(--primary); display: grid; place-items: center; flex: none; }
      h1 { font-size: 20px; margin: 0 0 4px; font-weight: 600; }
      .sub { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
      label { display: block; font-size: 13px; font-weight: 500; margin: 22px 0 8px; }
      input {
        width: 100%; height: 42px; padding: 0 12px; font: inherit; font-size: 14px;
        border: 1px solid var(--line); border-radius: 10px; background: transparent; color: inherit;
        outline: none;
      }
      input:focus { border-color: var(--primary); }
      .hint { font-size: 12px; color: var(--muted); margin: 8px 0 0; line-height: 1.6; }
      button {
        margin-top: 20px; width: 100%; height: 44px; border: 0; border-radius: 10px;
        background: var(--primary); color: var(--on-primary); font: inherit; font-size: 14px; font-weight: 500;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .error { color: #d64545; font-size: 12px; margin: 8px 0 0; min-height: 18px; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="34" height="34">
            <g stroke="var(--on-primary)" stroke-width="2.6" fill="none" stroke-linecap="round">
              <path d="M13 24h8M27 24h8" />
            </g>
            <circle cx="10.5" cy="24" r="3.4" fill="var(--on-primary)" />
            <circle cx="37.5" cy="24" r="3.4" fill="var(--on-primary)" />
            <rect x="21.5" y="19.5" width="9" height="9" rx="2.4" fill="var(--on-primary)" />
          </svg>
        </div>
        <div>
          <h1>连接到中枢</h1>
          <p class="sub">输入局域网内 Noobty 中枢的地址,只需配置一次。</p>
        </div>
      </div>
      <label for="hub">中枢地址</label>
      <input id="hub" placeholder="例如:http://192.168.1.10:7317" spellcheck="false" />
      <p class="error" id="error" role="alert"></p>
      <button id="save">连接</button>
      <p class="hint">地址就是浏览器打开 Noobty 时地址栏里的内容,可在中枢服务器上查看。之后可在托盘菜单修改。</p>
    </main>
    <script>
      const input = document.getElementById('hub')
      const errorEl = document.getElementById('error')
      const btn = document.getElementById('save')

      window.__TAURI__.core.invoke('hub_url').then((info) => {
        if (info && info.hub) input.value = info.hub
      })

      btn.addEventListener('click', async () => {
        errorEl.textContent = ''
        const url = input.value.trim().replace(/\/+$/, '')
        if (!/^https?:\/\//.test(url)) {
          errorEl.textContent = '地址需要以 http:// 或 https:// 开头'
          return
        }
        btn.disabled = true
        btn.textContent = '连接中…'
        try {
          const res = await fetch(url + '/api/healthz', { signal: AbortSignal.timeout(5000) })
          if (!res.ok) throw new Error('HTTP ' + res.status)
          await window.__TAURI__.core.invoke('set_hub_url', { url })
          await window.__TAURI__.core.invoke('open_hub')
        } catch (err) {
          errorEl.textContent = '连不上这个地址:' + String(err).slice(0, 80)
          btn.disabled = false
          btn.textContent = '连接'
        }
      })
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') btn.click()
      })
    </script>
  </body>
</html>
